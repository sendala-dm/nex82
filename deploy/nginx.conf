server {
    listen 80;
    listen [::]:80;
    server_name nex82.com www.nex82.com;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    if ($host = www.nex82.com) { return 301 https://nex82.com$request_uri; }

    # Preserve the existing extensionless canonical page URLs.
    location ~ ^/(about|careers|contact|hardware|infrastructure|software)/$ {
        return 301 https://nex82.com/$1$is_args$args;
    }
    location ~ ^/(about|careers|contact|hardware|infrastructure|software)/index\.html$ {
        return 301 https://nex82.com/$1$is_args$args;
    }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html { return 301 https://nex82.com/$is_args$args; }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~* \.(ico|png|jpg|jpeg|svg|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
